<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light dark">
  <meta name="robots" content="noindex, nofollow">
  <title>{% block title %}Sign in{% endblock %}</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='%234f46e5'%3E%3Cpath d='M12 1a5 5 0 0 0-5 5v3H6a2 2 0 0 0-2 2v9a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-9a2 2 0 0 0-2-2h-1V6a5 5 0 0 0-5-5zm-3 8V6a3 3 0 0 1 6 0v3H9z'/%3E%3C/svg%3E">
  <link rel="stylesheet" href="{{ url_for('static', path='css/styles.css') }}">
</head>
<body>
  <main class="page">
    <div class="card">
      <div class="card__header">
        <div class="brand-icon" aria-hidden="true">{% block icon %}{% endblock %}</div>
        <h1 class="card__title">{% block heading %}{% endblock %}</h1>
        {% block subheading %}{% endblock %}
      </div>
      {% block content %}{% endblock %}
    </div>
    <p class="page__footer">{% block footer %}Secured sign-in{% endblock %}</p>
  </main>
  <script src="{{ url_for('static', path='js/auth.js') }}" defer></script>
</body>
</html>
