{% extends "admin/_base.html" %}
{% block title %}Account{% endblock %}
{% block content %}
<div class="admin-header"><h1 class="admin-title">Account</h1></div>

{% if error %}<div class="alert alert--error" role="alert"><span>{{ error }}</span></div>{% endif %}
{% if success %}<div class="alert" role="status" style="background:var(--color-success-soft);color:var(--color-success);"><span>{{ success }}</span></div>{% endif %}

<div class="admin-card">
  <h2>Change password</h2>
  <form method="post" action="/admin/account" class="form">
    <div class="field">
      <label for="current_password">Current password</label>
      <input id="current_password" type="password" name="current_password" required autocomplete="current-password">
    </div>
    <div class="field">
      <label for="new_password">New password</label>
      <input id="new_password" type="password" name="new_password" required minlength="8" autocomplete="new-password">
    </div>
    <div class="field">
      <label for="confirm_password">Confirm new password</label>
      <input id="confirm_password" type="password" name="confirm_password" required minlength="8" autocomplete="new-password">
    </div>
    <button type="submit" class="btn btn--primary btn--block">Update password</button>
  </form>
</div>
{% endblock %}
