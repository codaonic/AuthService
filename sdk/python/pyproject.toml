[project]
name = "authservice-client"
version = "0.1.0"
description = "Token validation and framework helpers for services behind the shared auth service"
requires-python = ">=3.9"
dependencies = [
    "python-jose[cryptography]>=3.5.0",
    "httpx>=0.27",
]

[project.optional-dependencies]
fastapi = ["fastapi>=0.110"]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
    "fastapi>=0.110",
    "cryptography>=42.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.pytest.ini_options]
asyncio_mode = "auto"
