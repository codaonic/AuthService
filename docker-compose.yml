services:
  auth-service:
    build: .
    ports: ["${HOST_PORT:-8000}:8000"]
    env_file:
      - .env
    environment:
      - DB_HOST=${COMPOSE_DB_HOST}
      - REDIS_HOST=${COMPOSE_REDIS_HOST}
      - ISSUER=http://localhost:${HOST_PORT:-8000}
    volumes:
      - ./data/signing_keys:/app/keys
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${DB_NAME}
    volumes: ["./data/postgres:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER}"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5
