services:
  auth-service:
    build: .
    container_name: auth_backend
    ports: ["${HOST_PORT:-8113}:8113"]
    env_file:
      - .env
    environment:
      - DB_HOST=${COMPOSE_DB_HOST}
      - REDIS_HOST=${COMPOSE_REDIS_HOST}
      - ISSUER=${ISSUER}
    volumes:
      - ./data/signing_keys:/app/keys
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - nginx-proxy-net

  postgres:
    image: postgres:16
    container_name: auth_pgsql
    environment:
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${DB_NAME}
    volumes: ["./data/postgres:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER}"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - nginx-proxy-net

  redis:
    image: redis:7
    container_name: auth_redis
    command: ["redis-server", "--requirepass", "${REDIS_PASSWORD}"]
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "--no-auth-warning", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - nginx-proxy-net

networks:
  nginx-proxy-net:
    external: true