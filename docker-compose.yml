services:
  postgres:
    image: postgres:16
    container_name: auth_pgsql
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${DB_NAME}
    volumes: ["./data/postgres:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER} -d ${DB_NAME}"]
      interval: 5s
      timeout: 5s
      retries: 5
    # Loopback-only, not a public port -- lets a backend you run directly
    # on this host (outside Docker, for fast --reload iteration) reach this
    # same database at DB_HOST=localhost, DB_PORT=5434. Safe even if this
    # compose file runs on a public server: 127.0.0.1 binding is never
    # internet-reachable regardless of firewall rules, unlike a bare
    # "5432:5432" would be. Default is 5434, not 5432, since a host often
    # already has its own Postgres on the standard port.
    ports:
      - "127.0.0.1:${DB_HOST_PORT:-5434}:5432"
    networks:
      - nginx-proxy-net

  redis:
    image: redis:7
    container_name: auth_redis
    restart: unless-stopped
    command: ["redis-server", "--requirepass", "${REDIS_PASSWORD}"]
    healthcheck:
      test:
        [
          "CMD",
          "redis-cli",
          "-a",
          "${REDIS_PASSWORD}",
          "--no-auth-warning",
          "ping",
        ]
      interval: 5s
      timeout: 5s
      retries: 5
    volumes: ["./data/redis:/data"]
    # Same loopback-only reasoning as postgres above -- default 6381, not
    # 6379, for the same "host already has one" reason.
    ports:
      - "127.0.0.1:${REDIS_HOST_PORT:-6381}:6379"
    networks:
      - nginx-proxy-net
  auth-service:
    build: .
    container_name: auth_backend
    restart: unless-stopped
    ports: ["${HOST_PORT:-8113}:8113"]
    env_file:
      - .env
    environment:
      - DB_HOST=${COMPOSE_DB_HOST}
      - REDIS_HOST=${COMPOSE_REDIS_HOST}
      - ISSUER=${ISSUER}
    volumes:
      - ./data/signing_keys:/app/keys
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - nginx-proxy-net

networks:
  nginx-proxy-net:
    external: true
