[project]
name = "example-mcp-server"
version = "0.1.0"
description = "Example MCP server auth integration, using authservice-client to validate tokens"
requires-python = ">=3.12"
dependencies = [
    "authservice-client[fastapi]",
    "uvicorn[standard]>=0.30",
]

[tool.uv.sources]
authservice-client = { git = "https://github.com/codaonic/AuthService_Client.git", branch = "main" }

[tool.uv]
package = false
