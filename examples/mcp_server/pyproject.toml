[project]
name = "example-mcp-server"
version = "0.1.0"
description = "Example MCP server auth integration, using auth-service-sdk to validate tokens"
requires-python = ">=3.12"
dependencies = [
    "auth-service-sdk[fastapi]",
    "uvicorn[standard]>=0.30",
]

[tool.uv.sources]
auth-service-sdk = { path = "../../sdk/python", editable = true }

[tool.uv]
package = false
