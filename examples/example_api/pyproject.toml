[project]
name = "example-api"
version = "0.1.0"
description = "Example protected API resource server, using authservice-client to validate tokens"
requires-python = ">=3.12"
dependencies = [
    "authservice-client[fastapi]",
    "uvicorn[standard]>=0.30",
]

[tool.uv.sources]
authservice-client = { path = "../../sdk/python", editable = true }

[tool.uv]
package = false
